[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Keep the CI contract explicit across Ruff releases: syntax, import/use, and
# core pycodestyle errors. Broader modernization belongs in separate changes.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = [
  "tests/mindrove_station",
  "tools/mindrove_bridge/tests",
  "tools/mindrove_passive_scan",
]
