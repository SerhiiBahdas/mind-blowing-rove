name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos-probe:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build and check probe
        run: make check
      - name: Install user-space bridge dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r tools/mindrove_bridge/requirements-dev.txt
          python -m pip check
      - name: Test Python components
        run: python -m pytest -q
      - name: Lint Python components
        run: python -m ruff check mindrove_station tools tests/mindrove_station
      - name: Type-check Python components
        run: python -m mypy --explicit-package-bases --ignore-missing-imports mindrove_station tools/mindrove_bridge tools/mindrove_passive_scan
